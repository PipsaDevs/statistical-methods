name: Build Pendrive Deliverables

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pendrive:
    name: Build & Upload Pendrive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::roxygen2
            any::zip

      - name: Execute make_pendrive.R
        run: Rscript make_pendrive.R

      - name: Upload pendrive_ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: pendrive_ready
          path: pendrive_ready
          if-no-files-found: error
          retention-days: 30
